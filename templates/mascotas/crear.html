{% extends 'base.html' %}

{% block content %}
<div class="container mt-4 mb-5">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h3 class="mb-0">
                        <i class="bi bi-heart-pulse"></i>
                        {% if mascota %}Editar Mascota{% else %}Registrar Mascota{% endif %}
                    </h3>
                </div>

                <div class="card-body p-4">
                    <form method="post" enctype="multipart/form-data" novalidate>
                        {% csrf_token %}

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                                <input type="text" name="nombre" class="form-control" required
                                       value="{{ datos.nombre|default:'' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Especie <span class="text-danger">*</span></label>
                                <select name="especie" class="form-select" required>
                                    <option value="">— Seleccione —</option>
                                    {% for val, label in especies %}
                                    <option value="{{ val }}" {% if datos.especie == val %}selected{% endif %}>{{ label }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Raza</label>
                                <input type="text" name="raza" class="form-control" value="{{ datos.raza|default:'' }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Sexo</label>
                                <select name="sexo" class="form-select">
                                    <option value="">— Seleccione —</option>
                                    <option value="M" {% if datos.sexo == 'M' %}selected{% endif %}>Macho</option>
                                    <option value="H" {% if datos.sexo == 'H' %}selected{% endif %}>Hembra</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Fecha de nacimiento</label>
                                <input type="date" name="fecha_nacimiento" class="form-control"
                                       value="{{ datos.fecha_nacimiento|date:'Y-m-d' }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Peso (Kg)</label>
                                <input type="number" step="0.01" name="peso" class="form-control"
                                       value="{{ datos.peso|default:'' }}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Color</label>
                                <input type="text" name="color" class="form-control" value="{{ datos.color|default:'' }}">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">ID Microchip</label>
                                <input type="text" name="chip_id" class="form-control" value="{{ datos.chip_id|default:'' }}">
                            </div>
                            <div class="col-md-6 mb-3 d-flex align-items-end">
                                <div class="form-check">
                                    <input type="checkbox" name="esterilizado" class="form-check-input" id="ester"
                                           {% if datos.esterilizado %}checked{% endif %}>
                                    <label for="ester" class="form-check-label fw-bold">Esterilizado/a</label>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Foto</label>
                            <input type="file" name="foto" accept="image/*" class="form-control">
                            {% if mascota.foto %}
                            <div class="form-text">Foto actual: <a href="{{ mascota.foto.url }}" target="_blank">ver</a></div>
                            {% endif %}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Alergias</label>
                            <textarea name="alergias" class="form-control" rows="2">{{ datos.alergias|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Enfermedades crónicas</label>
                            <textarea name="enfermedades_cronicas" class="form-control" rows="2">{{ datos.enfermedades_cronicas|default:'' }}</textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Notas</label>
                            <textarea name="notas" class="form-control" rows="2">{{ datos.notas|default:'' }}</textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <a href="{% url 'listar_mascotas' %}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-check-circle"></i> Guardar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
