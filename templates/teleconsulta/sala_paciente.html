{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teleconsulta | VertexSalud</title>
  <style>
    html,body{margin:0;height:100%;background:#0b0f0d;font-family:system-ui,sans-serif}
    #jitsi{position:fixed;inset:0}
    #fin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#e2e8f0;background:#0b0f0d;text-align:center;padding:24px}
  </style>
  <script src="https://{{ jitsi_domain }}/external_api.js"></script>
</head>
<body>
  <div id="jitsi"></div>
  <div id="fin">
    <div id="finBox" style="max-width:460px">
      <div style="font-size:44px">✅</div>
      <h2>La teleconsulta finalizó</h2>
      <p style="color:#94a3b8">Gracias por usar VertexSalud. Puedes cerrar esta ventana.</p>
    </div>
  </div>
  <script>
  (function(){
    if (typeof JitsiMeetExternalAPI === 'undefined') {
      document.getElementById('jitsi').innerHTML =
        '<div style="color:#e2e8f0;padding:28px;text-align:center;max-width:420px;margin:15vh auto;font-family:sans-serif">'+
        '<div style="font-size:40px">🔒</div>'+
        '<h3>No se pudo cargar el video</h3>'+
        '<p>Abrí <a href="https://{{ jitsi_domain }}/" target="_blank" style="color:#22c55e;font-weight:bold">https://{{ jitsi_domain }}</a>, aceptá el certificado, y volvé a recargar esta página.</p></div>';
    } else {
      try{
        new JitsiMeetExternalAPI("{{ jitsi_domain }}", {
          roomName: "{{ sesion.sala_id }}",
          parentNode: document.getElementById('jitsi'),
          userInfo: { displayName: "{{ paciente_nombre|escapejs }}" },
          configOverwrite: { prejoinPageEnabled: false, disableDeepLinking: true },
          interfaceConfigOverwrite: { MOBILE_APP_PROMO: false }
        });
      }catch(e){ console.error(e); }
    }

    function poll(){
      fetch("{% url 'teleconsulta:estado' token %}").then(r=>r.json()).then(function(d){
        if(!d.finalizada) return;
        if(d.derivada){
          var emerg = d.derivacion_tipo === 'EMERGENCIA';
          var box = document.getElementById('finBox');
          box.innerHTML =
            '<div style="font-size:44px">'+(emerg?'🚨':'🏥')+'</div>'+
            '<h2>'+(emerg?'Necesitas atención de EMERGENCIA':'Necesitas atención PRESENCIAL')+'</h2>'+
            '<p style="color:#cbd5e1">Tu médico indicó que este caso debe atenderse '+(emerg?'de inmediato':'de forma presencial')+'.</p>'+
            (d.derivacion_motivo? '<p style="color:#94a3b8">Motivo: '+d.derivacion_motivo+'</p>':'')+
            (emerg? '<p style="font-size:22px;color:#f87171;font-weight:bold">Llama YA al ECU-911 (911)</p>':
                    '<p style="color:#94a3b8">Acude al establecimiento de salud más cercano.</p>');
        }
        document.getElementById('jitsi').style.display='none';
        document.getElementById('fin').style.display='flex';
      }).catch(function(){});
    }
    setInterval(poll, 4000);
  })();
  </script>
</body>
</html>
