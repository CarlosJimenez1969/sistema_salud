{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="card border-0 shadow-lg col-md-6 mx-auto" style="border-radius:12px;">
        <div class="card-body text-center p-5">
            <i class="bi bi-arrow-repeat text-warning display-4 mb-3"></i>
            <h4 class="fw-bold">¿Reenviar factura al SRI?</h4>
            <p class="text-muted">
                Factura <strong>{{ factura.numero_secuencial }}</strong> —
                Estado actual: <span class="badge bg-{{ factura.estado_badge }}">{{ factura.get_estado_display }}</span>
            </p>
            <p class="text-muted small">
                Esto regenerará el XML, lo firmará y lo enviará nuevamente al SRI.
            </p>
            <div class="d-flex justify-content-center gap-3 mt-4">
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning px-5 rounded-pill fw-bold">
                        <i class="bi bi-send me-2"></i> Confirmar reenvío
                    </button>
                </form>
                <a href="{% url 'detalle_factura' factura.id %}"
                   class="btn btn-outline-secondary px-5 rounded-pill">Cancelar</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
